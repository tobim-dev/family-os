<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024">
  <!-- Family OS app icon: a warm house at dusk, a glowing heart window and
       three stars for the family. Full-bleed square; iOS rounds the corners. -->
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0.35" y2="1">
      <stop offset="0" stop-color="#101d3a"/>
      <stop offset="0.52" stop-color="#2e2a63"/>
      <stop offset="0.8" stop-color="#7a3f78"/>
      <stop offset="1" stop-color="#e0766a"/>
    </linearGradient>
    <radialGradient id="glow" cx="512" cy="760" r="470" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#ffd08a" stop-opacity="0.95"/>
      <stop offset="0.35" stop-color="#ff9f76" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#ff9f76" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="wall" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fffaf3"/>
      <stop offset="1" stop-color="#f6e6d6"/>
    </linearGradient>
    <linearGradient id="roof" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#63d3a8"/>
      <stop offset="1" stop-color="#2f9f7d"/>
    </linearGradient>
    <linearGradient id="heart" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffc766"/>
      <stop offset="1" stop-color="#ff6b5a"/>
    </linearGradient>
    <radialGradient id="heartGlow" cx="512" cy="615" r="150" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#ffb35c" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#ffb35c" stop-opacity="0"/>
    </radialGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="26" stdDeviation="30" flood-color="#1a0f2e" flood-opacity="0.45"/>
    </filter>
    <clipPath id="wallClip">
      <path d="M300 540 L300 770 Q300 800 330 800 L694 800 Q724 800 724 770 L724 540 Z"/>
    </clipPath>
    <linearGradient id="eave" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#6b4a5a" stop-opacity="0.28"/>
      <stop offset="1" stop-color="#6b4a5a" stop-opacity="0"/>
    </linearGradient>
    <filter id="soft" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="6"/>
    </filter>
  </defs>

  <rect width="1024" height="1024" fill="url(#sky)"/>
  <rect width="1024" height="1024" fill="url(#glow)"/>

  <!-- Gentle hills -->
  <path d="M0 860 C 220 790 380 820 520 850 C 680 885 850 820 1024 800 V1024 H0 Z" fill="#3b2553" opacity="0.55"/>
  <path d="M0 910 C 260 860 520 900 700 930 C 840 952 940 930 1024 915 V1024 H0 Z" fill="#241a40" opacity="0.8"/>

  <!-- Three stars: Tobi, Britta, Lina -->
  <g fill="#fff4d6">
    <path d="M250 200 l14 38 38 14 -38 14 -14 38 -14 -38 -38 -14 38 -14 Z"/>
    <path d="M770 170 l11 30 30 11 -30 11 -11 30 -11 -30 -30 -11 30 -11 Z"/>
    <path d="M835 330 l7 19 19 7 -19 7 -7 19 -7 -19 -19 -7 19 -7 Z"/>
  </g>
  <g fill="#fff4d6" filter="url(#soft)" opacity="0.7">
    <circle cx="264" cy="252" r="16"/>
    <circle cx="781" cy="211" r="12"/>
    <circle cx="842" cy="356" r="8"/>
  </g>
  <g fill="#ffffff" opacity="0.45">
    <circle cx="160" cy="400" r="4"/>
    <circle cx="420" cy="140" r="3.5"/>
    <circle cx="610" cy="250" r="3"/>
    <circle cx="905" cy="520" r="3.5"/>
    <circle cx="130" cy="600" r="3"/>
  </g>

  <!-- House -->
  <g filter="url(#shadow)">
    <path d="M624 400 L624 250 Q624 236 638 236 L680 236 Q694 236 694 250 L694 440 Z" fill="#2f9f7d"/>
    <path d="M300 520 L300 770 Q300 800 330 800 L694 800 Q724 800 724 770 L724 520 Z" fill="url(#wall)"/>
    <path d="M512 262 Q530 262 546 275 L786 472 Q812 494 800 520 Q790 540 764 540 L260 540 Q234 540 224 520 Q212 494 238 472 L478 275 Q494 262 512 262 Z" fill="url(#roof)"/>
    <path d="M512 300 L262 505" stroke="#ffffff" stroke-opacity="0.35" stroke-width="14" stroke-linecap="round"/>
  </g>

  <!-- Heart window -->
  <g clip-path="url(#wallClip)">
    <rect x="300" y="540" width="424" height="46" fill="url(#eave)"/>
    <circle cx="512" cy="640" r="150" fill="url(#heartGlow)"/>
  </g>
  <path d="M512 718 C 440 668 404 634 404 592 C 404 560 428 538 458 538 C 482 538 500 552 512 572 C 524 552 542 538 566 538 C 596 538 620 560 620 592 C 620 634 584 668 512 718 Z" fill="url(#heart)"/>
  <path d="M446 574 Q458 558 476 560" stroke="#ffffff" stroke-opacity="0.7" stroke-width="12" fill="none" stroke-linecap="round"/>
</svg>
